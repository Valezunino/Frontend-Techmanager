<div class="layout-principal">
  <header class="barra-superior">
    <div class="contenedor-header">
      <div class="marca">
        <span class="icono-marca">📦</span>
        <h1>{{ tituloProyecto }}</h1>
      </div>
      <nav class="navegacion">
        <a routerLink="/productos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Listado</a>
        <a routerLink="/productos/nuevo" routerLinkActive="activo">+ Nuevo Producto</a>

        @if (authService.estaAutenticado()) {
          <a routerLink="/login" routerLinkActive="activo" class="badge-jwt activo-jwt">
            🔑 JWT: {{ authService.usuarioActual() }}
          </a>
        } @else {
          <a routerLink="/login" routerLinkActive="activo" class="badge-jwt">
            🔐 Login (JWT)
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="contenido-principal">
    <!-- Acá Angular inyecta el componente que corresponda según la ruta activa (app.routes.ts) -->
    <router-outlet />
  </main>

  <footer class="pie-pagina">
    <p>Proyecto Base Angular 22 + Spring Boot (Puerto 8000 + JWT) + PostgreSQL</p>
  </footer>
</div>
